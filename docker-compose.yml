services:
  postgres:
    image: postgres:16-alpine
    container_name: yunjian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yunjian
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - yunjian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yunjian"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yunjian_pgdata:
